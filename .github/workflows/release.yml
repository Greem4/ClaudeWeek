name: Release

# Выпуск версии: поставили тег vX.Y.Z — GitHub собрал образ под Apple Silicon,
# посчитал контрольную сумму и выложил в Releases.
#
# Обычно тег ставится сам: слияние PR в main поднимает версию и запускает этот
# workflow — см. release-on-merge.yml, там же метки, которыми выбирается разряд.
# Руками это тот же тег:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Собираем только arm64: Intel-сборку негде честно проверить, а образ, который
# никто не запускал, обещает больше, чем проект может выдержать. Кому нужен
# Intel — `./scripts/install.sh` соберёт нативно на своей машине.
#
# Версия в теге и в Sources/ClaudeWeekCore/Version.swift должны совпадать —
# иначе сборка останавливается: релиз, чья цифра расходится с той, что
# программа показывает в «О программе», хуже отсутствующего.
#
# Кроме тега есть запуск руками — Actions → Release → Run workflow, в поле
# ref выбрать тег. Он нужен на случай, когда push тега прошёл мимо Actions:
# событие потерялось, а тег уже занят, и перевыпустить релиз нечем.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    # macos-26, а не macos-15, ради облика: Tahoe выдаёт новое оформление
    # только приложениям, собранным с SDK 26, остальным рисует прежний
    # плоский вид. Раннер macos-15 приносит SDK 15, и релизная сборка
    # выглядела старее локальной. Совместимость при этом не страдает:
    # минимальная версия задана в Package.swift (.macOS(.v14)) и от SDK
    # не зависит — образ по-прежнему запускается на macOS 14 и 15.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # нужна вся история: заметки собираются от прошлого тега

      - name: Сверяю тег с Version.swift
        run: |
          # При запуске руками ref может оказаться веткой — из неё релиз не
          # соберётся: имя тега идёт и в версию, и в заметки, и в имя релиза.
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "::error::запускать нужно по тегу (Run workflow → ref → vX.Y.Z), а не по $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          TAG="${GITHUB_REF_NAME#v}"
          SRC="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' \
            Sources/ClaudeWeekCore/Version.swift)"
          echo "тег: $TAG, Version.swift: $SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с версией $SRC в Version.swift"
            exit 1
          fi
          echo "VERSION=$SRC" >> "$GITHUB_ENV"

      - name: Проверки
        run: swift run ClaudeWeekTests

      # Постоянный сертификат подписи: без него образ подписывается ad-hoc, а
      # разрешение на чтение токена Claude Code macOS привязывает к designated
      # requirement — у ad-hoc это хеш бинаря, свой у каждой сборки, и человек
      # получает вопрос про доступ к Keychain после каждого обновления.
      # Секретов нет — шаг пропускается, и всё идёт как прежде.
      #
      # Ключ здесь только за стабильность requirement: сертификат
      # самоподписанный, подлинности сборки он не доказывает (для этого нужен
      # Developer ID и нотаризация) и Gatekeeper им не обмануть.
      # Как получить пару: ./scripts/signing-cert.sh --export cert.p12,
      # затем base64 -i cert.p12 → секрет SIGNING_CERT_P12, пароль →
      # SIGNING_CERT_PASSWORD.
      # Наличие секрета проверяется отдельным шагом, а не прямо в `if`:
      # контекст `secrets` в условиях шага недоступен, и GitHub отвергает такой
      # файл целиком — падает не шаг, а весь workflow, ещё до первой команды.
      - name: Есть ли сертификат подписи
        id: signing
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "секрета SIGNING_CERT_P12 нет — образ будет подписан ad-hoc"
          fi

      - name: Сертификат подписи
        if: steps.signing.outputs.available == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Связка должна попасть в список поиска, иначе codesign её не увидит;
          # прежние оставляем на месте — из них раннер берёт всё остальное.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # На раннере sudo без пароля, поэтому доверие ставим на всю машину:
          # самоподписанную identity codesign иначе не берёт.
          KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD" \
            ./scripts/signing-cert.sh --import "$RUNNER_TEMP/cert.p12" \
              --keychain "$KEYCHAIN" --trust system
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Образ — Apple Silicon (arm64)
        run: ARCH=arm64 ./scripts/make-dmg.sh

      # Облик приложения на macOS 26 решает не код, а SDK, которым бинарь
      # слинкован: со старым Tahoe рисует прежнее плоское оформление. Образ
      # люди получают готовым и пересобрать его не могут, поэтому раннер,
      # тихо съехавший на старый SDK, должен ронять релиз, а не выкладывать
      # приложение, выглядящее старее собранного дома.
      - name: Сверяю SDK сборки
        run: |
          SDK="$(vtool -show-build dist/ClaudeWeek.app/Contents/MacOS/ClaudeWeek \
            | awk '/^ *sdk /{print $2}')"
          echo "бинарь слинкован с SDK $SDK"
          case "$SDK" in
            2[6-9].*|[3-9][0-9].*) ;;
            *)
              echo "::error::нужен SDK 26 или новее, а взят $SDK — на macOS 26 сборка будет выглядеть по-старому"
              exit 1
              ;;
          esac

      - name: Контрольная сумма
        working-directory: dist
        run: shasum -a 256 "ClaudeWeek-$VERSION-arm64.dmg" | tee SHA256SUMS.txt

      - name: Заметки к релизу
        run: |
          PREV="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo '## Установка'
            echo
            echo "Скачайте \`ClaudeWeek-$VERSION-arm64.dmg\`, перетащите приложение"
            echo 'в Applications и снимите карантин:'
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine /Applications/ClaudeWeek.app'
            echo '```'
            echo
            if codesign -d -r- dist/ClaudeWeek.app 2>&1 | grep -q 'certificate leaf'; then
              echo 'Сборка подписана постоянным сертификатом проекта. Apple Developer ID'
              echo 'у неё всё равно нет, поэтому Gatekeeper просит подтверждения — зато'
              echo 'доступ к токену Claude Code macOS спросит один раз: requirement'
              echo 'подписи от версии к версии не меняется, и разрешение переживает'
              echo 'обновление.'
            else
              echo 'Сборка подписана ad-hoc, без Apple Developer ID, поэтому Gatekeeper'
              echo 'просит подтверждения. Кому это не нравится — собирайте из исходников:'
              echo '`./scripts/install.sh`.'
            fi
            echo
            echo 'Требуется macOS 14+ на Apple Silicon (M1 и новее). Готового образа'
            echo 'под Intel нет — там сборка из исходников тем же `install.sh`.'
            echo
            echo '## Что изменилось'
            echo
            if [ -n "$PREV" ]; then
              git log --pretty='- %s' "$PREV..$GITHUB_REF_NAME"
              echo
              echo "[Все изменения с $PREV](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$PREV...$GITHUB_REF_NAME)"
            else
              echo '- первый релиз'
            fi
            echo
            echo '## Контрольная сумма'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/NOTES.md
          cat dist/NOTES.md

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Повторный запуск по тому же тегу дособирает уже созданный релиз,
          # а не падает на «release already exists»: ради этого ручной запуск
          # и заводился — чинить надо неудавшийся выпуск, а не заводить новый.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "ClaudeWeek $VERSION" \
              --notes-file dist/NOTES.md
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "dist/ClaudeWeek-$VERSION-arm64.dmg" \
              dist/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ClaudeWeek $VERSION" \
              --notes-file dist/NOTES.md \
              "dist/ClaudeWeek-$VERSION-arm64.dmg" \
              dist/SHA256SUMS.txt
          fi
